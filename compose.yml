services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zapply
      POSTGRES_USER: zapply
      POSTGRES_PASSWORD: zapply
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zapply -d zapply"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - z_apply_postgres:/var/lib/postgresql/data

volumes:
  z_apply_postgres:
